<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{position:fixed;left:0;top:0;display:block}
@font-face{font-family:'Oxanium';src:url(../fonts/Oxanium-700.woff2) format('woff2');font-weight:700}@font-face{font-family:'Barlow';src:url(../fonts/Barlow-600.woff2) format('woff2');font-weight:600}</style></head>
<body><canvas id="gl"></canvas><canvas id="tx"></canvas>
<script type="module">
// STARWARD cover / thumbnail generator, rendered with the game's own planet shader.  covers.html?w=1920&h=1080&text=1
import { Space3D, WORLDS, spinTilt } from '../src/render/planet.js';
const q = new URLSearchParams(location.search); const W = +q.get('w') || 1920, H = +q.get('h') || 1080, TEXT = q.get('text') !== '0';
const land = W / H > 1.3, port = H / W > 1.2, S = Math.min(W, H);
await Promise.all([document.fonts.load('700 120px Oxanium'), document.fonts.load('600 30px Barlow')]);
const g = new Space3D(document.getElementById('gl')); g.resize(W, H, 1);
const sunDir = (x, y, sx, sy) => { const dx = sx - x, dy = sy - y, l = Math.hypot(dx, dy) || 1; return [dx / l * 0.9, -dy / l * 0.9, 0.42]; };
const SUN = [W * (land ? 0.92 : 0.95), H * (port ? 0.08 : 0.1)];
g.begin(3.7, [0.12, 0.16, 0.42], [0.3, 0.1]);
// far worlds first, then the Moon, then Earth filling the lower frame
const earth = { x: W * (land ? 0.36 : 0.5), y: H * (TEXT ? (port ? 1.05 : 1.12) : 1.0), r: S * (land ? 0.62 : port ? 0.62 : 0.6) };
const moon = { x: W * (land ? 0.8 : 0.78), y: H * (port ? 0.5 : TEXT ? 0.42 : 0.3), r: S * 0.09 };
const sat = { x: W * (land ? 0.6 : 0.22), y: H * (port ? 0.36 : 0.22), r: S * 0.035 };
const mars = { x: W * (land ? 0.14 : 0.16), y: H * (port ? 0.58 : 0.42), r: S * 0.026 };
g.planet(WORLDS.saturn, sat.x, sat.y, sat.r, spinTilt(0.8, 0.45), sunDir(sat.x, sat.y, ...SUN), 2);
g.planet(WORLDS.mars, mars.x, mars.y, mars.r, spinTilt(1.4, 0.3), sunDir(mars.x, mars.y, ...SUN), 2);
g.planet(WORLDS.moon, moon.x, moon.y, moon.r, spinTilt(0.5, 0.1), sunDir(moon.x, moon.y, ...SUN), 2);
g.planet(WORLDS.earth, earth.x, earth.y, earth.r, spinTilt(2.2, 0.41), sunDir(earth.x, earth.y, ...SUN), 6, { p0: [0.02, 1.0, 0.16, 1.0] });
// 2D layer: the Sun's glare, Saturn's rings, a rocket climbing from the limb, the title
const cv = document.getElementById('tx'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
const sg = c.createRadialGradient(...SUN, 0, ...SUN, S * 0.5); sg.addColorStop(0, 'rgba(255,250,235,0.95)'); sg.addColorStop(0.05, 'rgba(255,230,180,0.55)'); sg.addColorStop(0.25, 'rgba(255,170,90,0.12)'); sg.addColorStop(1, 'rgba(255,150,60,0)'); c.fillStyle = sg; c.fillRect(0, 0, W, H);
c.strokeStyle = 'rgba(230,210,170,0.75)'; c.lineWidth = Math.max(1.5, sat.r * 0.18); c.beginPath(); c.ellipse(sat.x, sat.y, sat.r * 2.3, sat.r * 0.7, -0.3, 0, Math.PI); c.stroke();
// rocket: rising from the dawn limb with an exhaust plume
const k = S * 0.0011; const rx = land ? W * 0.63 : W * 0.72, ry = earth.y - earth.r * (land ? 0.9 : 0.97) - S * 0.2; // rocket centre; it is 90 units tall
const base = ry + 30 * k; const plume = c.createLinearGradient(rx, base, rx - S * 0.04, base + S * 0.22); plume.addColorStop(0, 'rgba(255,245,215,0.95)'); plume.addColorStop(0.25, 'rgba(255,180,90,0.65)'); plume.addColorStop(1, 'rgba(255,130,50,0)');
c.fillStyle = plume; c.beginPath(); c.moveTo(rx - 6 * k, base); c.quadraticCurveTo(rx - S * 0.03, base + S * 0.12, rx - S * 0.06, base + S * 0.24); c.lineTo(rx - S * 0.01, base + S * 0.24); c.quadraticCurveTo(rx + S * 0.002, base + S * 0.1, rx + 6 * k, base); c.fill();
const smoke = c.createRadialGradient(rx - S * 0.05, base + S * 0.24, 0, rx - S * 0.05, base + S * 0.24, S * 0.08); smoke.addColorStop(0, 'rgba(240,240,245,0.35)'); smoke.addColorStop(1, 'rgba(240,240,245,0)'); c.fillStyle = smoke; c.fillRect(rx - S * 0.15, base + S * 0.14, S * 0.2, S * 0.2);
c.save(); c.translate(rx, ry); c.rotate(0.12); c.scale(k, k); const bg2 = c.createLinearGradient(-7, 0, 7, 0); bg2.addColorStop(0, '#c9d0d8'); bg2.addColorStop(0.45, '#ffffff'); bg2.addColorStop(1, '#7d8794'); c.fillStyle = bg2; c.fillRect(-7, -60, 14, 90);
c.beginPath(); c.moveTo(-7, -60); c.quadraticCurveTo(0, -84, 7, -60); c.fill(); c.fillStyle = '#e8b04a'; c.fillRect(-7, 6, 14, 4); c.fillStyle = '#20252c'; c.fillRect(-7, -30, 14, 3); c.fillStyle = '#596270'; c.beginPath(); c.moveTo(-7, 18); c.lineTo(-13, 30); c.lineTo(-7, 30); c.fill(); c.beginPath(); c.moveTo(7, 18); c.lineTo(13, 30); c.lineTo(7, 30); c.fill(); c.restore();
const fl = c.createRadialGradient(rx, base, 0, rx, base, S * 0.035); fl.addColorStop(0, 'rgba(255,255,230,1)'); fl.addColorStop(1, 'rgba(255,180,80,0)'); c.fillStyle = fl; c.fillRect(rx - S * 0.04, base - S * 0.04, S * 0.08, S * 0.08);
if (TEXT) {
  const ty = port ? H * 0.17 : land ? H * 0.2 : H * 0.17; const fs = S * (land ? 0.15 : port ? 0.15 : 0.15); c.textAlign = 'center'; const tx = land ? W * 0.36 : W / 2;
  c.font = `700 ${fs}px Oxanium`; c.shadowColor = 'rgba(110,231,255,0.65)'; c.shadowBlur = fs * 0.25; const tg = c.createLinearGradient(0, ty - fs, 0, ty); tg.addColorStop(0, '#ffffff'); tg.addColorStop(0.6, '#9ff0ff'); tg.addColorStop(1, '#3aa0e0'); c.fillStyle = tg;
  c.save(); c.translate(tx, ty); c.scale(1.04, 1); c.fillText('STARWARD', 0, 0); c.restore(); c.shadowBlur = 0;
  c.font = `600 ${fs * 0.2}px Barlow`; c.fillStyle = '#ffd166'; c.fillText('BUILD A SPACE EMPIRE', tx, ty + fs * 0.42);
  c.font = `600 ${fs * 0.14}px Barlow`; c.fillStyle = 'rgba(233,244,255,0.85)'; c.fillText('From one launch pad to the edge of the universe', tx, ty + fs * 0.68);
}
window.coverReady = true;
</script></body></html>
