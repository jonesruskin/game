<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// HORDEMIND cover art generator. Usage: covers.html?w=1920&h=1080&text=1
import { HuntRenderer } from '../src/game.js';
import { HERO, QUEEN, SPECIES, QUEEN_SKINS } from '../src/data.js';
const q = new URLSearchParams(location.search); const W = +q.get('w') || 1920, H = +q.get('h') || 1080, TEXT = q.get('text') !== '0';
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const x = cv.getContext('2d');
const R0 = new HuntRenderer(document.createElement('canvas')); R0.ctx = x; R0.t = 0.7;
let seed = 11; const R = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const TAU = Math.PI * 2; const land = W / H > 1.3, port = H / W > 1.2; const u = Math.min(W, H) / 100;
// cave background
let g = x.createRadialGradient(W * 0.6, H * 0.45, 0, W * 0.6, H * 0.45, Math.max(W, H) * 0.85); g.addColorStop(0, '#2d6a4f'); g.addColorStop(0.4, '#14302a'); g.addColorStop(1, '#050b0b'); x.fillStyle = g; x.fillRect(0, 0, W, H);
// glowing mushrooms + spores
for (let i = 0; i < 90; i++) { const mx = R() * W, my = R() * H, s = u * (0.4 + R() * 1.2); x.fillStyle = `rgba(124,252,154,${0.08 + R() * 0.2})`; x.beginPath(); x.arc(mx, my, s * 3, 0, TAU); x.fill(); x.fillStyle = R() < 0.5 ? '#c7f9cc' : '#e0aaff'; x.globalAlpha = 0.6; x.beginPath(); x.arc(mx, my, s * 0.6, 0, TAU); x.fill(); x.globalAlpha = 1; }
// layout
const hero = HERO.ignis;
const HX = land ? W * 0.68 : W * 0.55, HY = land ? H * 0.5 : port ? H * 0.42 : H * 0.44;
const HS = land ? H / 230 : W / 210; // hero scale (r 34)
const QX = land ? W * 0.2 : W * 0.24, QY = land ? H * 0.78 : port ? H * 0.84 : H * 0.8, QS = land ? H / 190 : W / 165;
// red telegraph (whirlwind) under the hero
x.save(); x.translate(HX, HY); x.fillStyle = 'rgba(255,45,85,.18)'; x.beginPath(); x.arc(0, 0, 34 * HS * 1.9, 0, TAU); x.fill(); x.fillStyle = 'rgba(255,45,85,.28)'; x.beginPath(); x.arc(0, 0, 34 * HS * 1.35, 0, TAU); x.fill(); x.strokeStyle = 'rgba(255,45,85,.9)'; x.lineWidth = u * 0.5; x.beginPath(); x.arc(0, 0, 34 * HS * 1.9, 0, TAU); x.stroke(); x.restore();
// the swarm: a river of minions flowing from the queen to the hero
const sp = ['drone', 'drone', 'spitter', 'swarmling', 'swarmling', 'bomber', 'brute', 'leech'];
const minions = [];
const N = land ? 900 : 700;
for (let i = 0; i < N; i++) {
  const t = Math.pow(R(), 0.8); // denser near hero
  const cx1 = (QX + HX) / 2 + (land ? 0 : -W * 0.2), cy1 = Math.min(QY, HY) + (land ? -H * 0.15 : H * 0.05);
  const bx = (1 - t) * (1 - t) * QX + 2 * (1 - t) * t * cx1 + t * t * HX, by = (1 - t) * (1 - t) * QY + 2 * (1 - t) * t * cy1 + t * t * HY;
  const spread = u * (3 + 13 * t);
  let mx = bx + (R() - 0.5) * spread * 2.4, my = by + (R() - 0.5) * spread * 2.4;
  if (Math.hypot(mx - HX, my - HY) < 34 * HS * 1.05) continue; // don't cover the hero
  if (Math.hypot(mx - QX, my - QY) < 40 * QS) continue;
  const tx = t > 0.85 ? HX : (1 - t) * QX + t * HX + 0, ty = t > 0.85 ? HY : (1 - t) * QY + t * HY;
  const a = Math.atan2(HY - my, HX - mx) + (R() - 0.5) * 0.6;
  minions.push({ x: mx, y: my, s: sp[Math.floor(R() * sp.length)], a, ph: R() * TAU, k: 0.75 + t * 0.5 });
}
// a ring of attackers wrapping the hero
for (let i = 0; i < (land ? 260 : 220); i++) { const a = R() * TAU, r = 34 * HS * (1.08 + R() * 0.9); const mx = HX + Math.cos(a) * r, my = HY + Math.sin(a) * r; minions.push({ x: mx, y: my, s: sp[Math.floor(R() * sp.length)], a: a + Math.PI + (R() - 0.5) * 0.5, ph: R() * TAU, k: 1 }); }
minions.sort((a, b) => a.y - b.y);
const ms = land ? H / 640 : W / 540;
for (const m of minions) { const S = SPECIES[m.s]; x.save(); x.translate(m.x, m.y); x.scale(ms * m.k, ms * m.k); R0.drawMinion({ x: 0, y: 0, vx: Math.cos(m.a), vy: Math.sin(m.a), r: S.r, color: S.color, frozen: 0, phase: m.ph, sp: m.s, id: 1 }, true, { phaseT: 0 }); x.restore(); }
// impact sparks around hero
for (let i = 0; i < 40; i++) { const a = R() * TAU, r = 34 * HS * (1 + R() * 0.4); x.fillStyle = R() < 0.5 ? '#fff' : '#ffd166'; x.globalAlpha = 0.5 + R() * 0.5; x.beginPath(); x.arc(HX + Math.cos(a) * r, HY + Math.sin(a) * r, u * (0.2 + R() * 0.4), 0, TAU); x.fill(); } x.globalAlpha = 1;
// hero (looking worried at the swarm)
x.save(); x.translate(HX, HY); x.scale(HS, HS);
R0.drawHero({ hero: { x: 0, y: 0, r: 34, hp: 1, maxHp: 1, aim: Math.atan2(QY - HY, QX - HX), level: 0, hitT: 0, shieldT: 0, poison: 0, moving: false, walk: 0, enraged: false }, heroDef: hero }, 0.3);
// alarmed face: open mouth + sweat drop
x.fillStyle = '#0b1320'; x.beginPath(); x.ellipse(0, 14, 7, 9, 0, 0, TAU); x.fill();
x.fillStyle = '#a0e7ff'; x.strokeStyle = '#0b1320'; x.lineWidth = 2; x.beginPath(); x.moveTo(24, -14); x.quadraticCurveTo(31, -2, 24, 2); x.quadraticCurveTo(17, -2, 24, -14); x.fill(); x.stroke();
x.restore();
// queen in the foreground
x.save(); x.translate(QX, QY); x.scale(QS, QS);
R0.drawQueen({ queen: { x: 0, y: 0, hp: 1, maxHp: 1, hitT: 0, rootT: 0, face: Math.atan2(HY - QY, HX - QX), skin: QUEEN_SKINS[3] }, queenDef: QUEEN.vyx, phaseT: 0, cover: true }, 0.4);
x.restore();
// title (CrazyGames allows only the game title)
if (TEXT) {
  let fs = land ? H * 0.17 : W * 0.2; const ty = land ? H * 0.14 : H * 0.11;
  x.save(); x.translate(land ? W * 0.32 : W / 2, ty); x.transform(1, 0, -0.12, 1, 0, 0); x.font = `italic 900 ${fs}px 'Trebuchet MS', 'Arial Black', sans-serif`;
  const a = 'HORDE', b = 'MIND'; const maxW = land ? W * 0.58 : W * 0.9; const fit = maxW / x.measureText(a + b).width; if (fit < 1) { fs *= fit; x.font = `italic 900 ${fs}px 'Trebuchet MS', 'Arial Black', sans-serif`; }
  const wa = x.measureText(a).width, wb = x.measureText(b).width; const sx = -(wa + wb) / 2; x.textBaseline = 'middle'; x.textAlign = 'left'; x.lineJoin = 'round';
  const part = (t, px, fill, shade, glow) => { x.shadowColor = glow; x.shadowBlur = fs * 0.35; x.fillStyle = shade; x.fillText(t, px, fs * 0.07); x.shadowBlur = 0; x.strokeStyle = '#04100c'; x.lineWidth = fs * 0.12; x.strokeText(t, px, 0); x.fillStyle = fill; x.fillText(t, px, 0); };
  part(a, sx, '#ffffff', '#2d6a4f', 'rgba(124,252,154,.7)'); part(b, sx + wa, '#b5e48c', '#1b4332', 'rgba(181,228,140,.8)'); x.restore();
}
g = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
window.coverReady = true;
</script></body></html>
