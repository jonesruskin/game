# Helioscend Orbital Trials server (Cloudflare Worker + D1). See README.md for the five deploy steps.
name = "helioscend-trials"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "helioscend_trials"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"   # printed by: wrangler d1 create helioscend_trials

[vars]
# "on": the server re-runs every submitted battle with the game's own engine and records its result (needs Workers Paid:
#        a battle takes 15-100 ms of CPU and the free plan allows 10 ms per request).
# "off": Workers Free; the server accepts the client's result after sanity checks.
VERIFY = "on"
# the origin allowed to call the API ("*" for any; set it to your game's domain in production)
ALLOWED_ORIGIN = "*"
