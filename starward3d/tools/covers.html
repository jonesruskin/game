<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#02040a;overflow:hidden}canvas{position:fixed;left:0;top:0;display:block}
@font-face{font-family:'Oxanium';src:url(../src/ui/fonts/Oxanium-700.woff2) format('woff2');font-weight:700}@font-face{font-family:'Barlow';src:url(../src/ui/fonts/Barlow-600.woff2) format('woff2');font-weight:600}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// STARWARD 3D cover / thumbnail compositor. The store tool renders the real game (a staged showcase colony, HUD hidden)
// and passes the shot in as ?bg=; this page frames it and adds the title.   covers.html?w=1920&h=1080&text=1&bg=...
const q = new URLSearchParams(location.search); const W = +q.get('w') || 1920, H = +q.get('h') || 1080, TEXT = q.get('text') !== '0';
const land = W / H > 1.3, port = H / W > 1.2, S = Math.min(W, H);
await Promise.all([document.fonts.load('700 120px Oxanium'), document.fonts.load('600 30px Barlow')]);
const c = document.getElementById('c'); c.width = W; c.height = H; const g = c.getContext('2d');
const img = new Image(); img.src = q.get('bg'); await img.decode();
// cover-fit the shot
const ia = img.width / img.height, ca = W / H; let sw = img.width, sh = img.height, sx = 0, sy = 0; if (ia > ca) { sw = sh * ca; sx = (img.width - sw) / 2; } else { sh = sw / ca; sy = (img.height - sh) / 2; }
g.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
if (TEXT) {
  // a soft dark field where the title sits
  const gr = land ? g.createLinearGradient(0, 0, W * 0.62, 0) : g.createLinearGradient(0, 0, 0, H * 0.5);
  gr.addColorStop(0, 'rgba(3,8,20,0.88)'); gr.addColorStop(0.55, 'rgba(3,8,20,0.45)'); gr.addColorStop(1, 'rgba(3,8,20,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const x = land ? W * 0.06 : W / 2, align = land ? 'left' : 'center'; g.textAlign = align; g.textBaseline = 'alphabetic';
  const fs = land ? S * 0.16 : S * 0.17; let y = land ? H * 0.4 : H * (port ? 0.13 : 0.17);
  g.font = `700 ${fs}px Oxanium`; const title = 'STARWARD';
  const tg = g.createLinearGradient(0, y - fs, 0, y); tg.addColorStop(0, '#ffffff'); tg.addColorStop(1, '#9fe9ff');
  g.save(); g.shadowColor = 'rgba(80,200,255,0.8)'; g.shadowBlur = S * 0.04; g.fillStyle = tg; g.fillText(title, x, y); g.restore();
  // the 3D badge
  const tw = g.measureText(title).width; const bx = land ? x + tw + S * 0.02 : x + tw / 2 - fs * 0.62, by = y - fs * 0.78, bw = fs * 0.78, bh = fs * 0.62;
  if (land) { g.save(); g.fillStyle = '#ffd36a'; g.shadowColor = 'rgba(255,190,60,0.7)'; g.shadowBlur = S * 0.03; g.beginPath(); g.roundRect(bx, by, bw, bh, bh * 0.22); g.fill(); g.restore(); g.fillStyle = '#1a1206'; g.font = `700 ${bh * 0.72}px Oxanium`; g.textAlign = 'center'; g.fillText('3D', bx + bw / 2, by + bh * 0.76); g.textAlign = align; }
  else { y += fs * 0.62; g.save(); g.fillStyle = '#ffd36a'; g.shadowColor = 'rgba(255,190,60,0.7)'; g.shadowBlur = S * 0.03; g.beginPath(); g.roundRect(x - bw / 2, y - bh * 0.78, bw, bh, bh * 0.22); g.fill(); g.restore(); g.fillStyle = '#1a1206'; g.font = `700 ${bh * 0.72}px Oxanium`; g.fillText('3D', x, y - bh * 0.02); }
  const ts = land ? S * 0.042 : S * 0.05; g.font = `600 ${ts}px Barlow`; g.fillStyle = 'rgba(233,244,255,0.92)';
  const lines = land ? ['Build your colony in orbit.', 'Collect, fuse and battle 114 robots.'] : ['Build your colony in orbit.', 'Collect 114 robots.'];
  lines.forEach((l, i) => g.fillText(l, x, y + ts * 1.9 + i * ts * 1.3));
}
window.coverReady = true;
</script></body></html>
