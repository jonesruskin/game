<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#02040a;overflow:hidden}canvas{position:fixed;left:0;top:0;display:block}
@font-face{font-family:'Oxanium';src:url(../src/ui/fonts/Oxanium-700.woff2) format('woff2');font-weight:700}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// HELIOSCEND cover / thumbnail compositor: "from one launch pad to the stars" in one picture. The store tool renders two
// real moments from the game (HUD hidden), each at 1.3x so it can be placed without upscaling: a rocket lifting off the
// Earth spaceport (?a=, rocket at ax,ay) and a supply lander touching down on Mars (?b=, lander at bx,by). They meet on a
// glowing diagonal, a golden trajectory arcs from one to the other, and the title (the only text CrazyGames allows) sits
// along the bottom, clear of the badges CrazyGames puts in the top-left corner.   covers.html?w=1920&h=1080&text=1&...
const q = new URLSearchParams(location.search); const W = +q.get('w') || 1920, H = +q.get('h') || 1080, TEXT = q.get('text') !== '0';
const land = W / H > 1.3, port = H / W > 1.2, S = Math.min(W, H);
await document.fonts.load('700 120px Oxanium');
const c = document.getElementById('c'); c.width = W; c.height = H; const g = c.getContext('2d');
const load = async (src) => { const i = new Image(); i.src = src; await i.decode(); return i; }; const A = await load(q.get('a')), B = await load(q.get('b'));
const ax = +q.get('ax'), ay = +q.get('ay'), bx = +q.get('bx'), by = +q.get('by');
// where each moment sits, and the seam between them (top-left stays scenery: CrazyGames' badges go there)
let tA, tB, seam;
if (land) { tA = [0.3 * W, 0.4 * H]; tB = [0.72 * W, 0.47 * H]; seam = [[0.6 * W, 0], [0.44 * W, H]]; }
else if (port) { tA = [0.6 * W, 0.26 * H]; tB = [0.42 * W, 0.58 * H]; seam = [[0, 0.47 * H], [W, 0.37 * H]]; }
else { tA = [0.33 * W, 0.35 * H]; tB = [0.68 * W, 0.56 * H]; seam = [[0.66 * W, 0], [0.4 * W, H]]; }
// place an image so its subject lands on the target, without ever leaving an edge uncovered
const place = (img, sx, sy, t) => { const x = Math.min(0, Math.max(W - img.width, t[0] - sx)), y = Math.min(0, Math.max(H - img.height, t[1] - sy)); g.drawImage(img, x, y); return [sx + x, sy + y]; };
const pA = place(A, ax, ay, tA);
const poly = land || !port ? [seam[0], [W, 0], [W, H], seam[1]] : [seam[0], seam[1], [W, H], [0, H]];
g.save(); g.beginPath(); poly.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.clip(); const pB = place(B, bx, by, tB); g.restore();
// the seam: a soft shadow either side and a bright line
g.save(); g.lineCap = 'round'; g.strokeStyle = 'rgba(2,6,16,0.45)'; g.lineWidth = S * 0.03; g.filter = `blur(${S * 0.012}px)`; g.beginPath(); g.moveTo(...seam[0]); g.lineTo(...seam[1]); g.stroke(); g.filter = 'none';
g.shadowColor = 'rgba(140,225,255,0.95)'; g.shadowBlur = S * 0.02; g.strokeStyle = 'rgba(235,250,255,0.95)'; g.lineWidth = Math.max(2, S * 0.0045); g.beginPath(); g.moveTo(...seam[0]); g.lineTo(...seam[1]); g.stroke(); g.restore();
// the journey: a dashed golden arc from the rocket's nose to the lander, with a glint at each end
{ const s0 = [pA[0], pA[1] - S * 0.05], s1 = [pB[0], pB[1] - S * 0.04]; const lift = S * (port ? 0.18 : 0.22); const cx = (s0[0] + s1[0]) / 2 + (port ? W * 0.28 : 0), cy = Math.min(s0[1], s1[1]) - lift;
  g.save(); g.lineCap = 'round'; g.setLineDash([S * 0.016, S * 0.014]); g.shadowColor = 'rgba(255,190,80,0.9)'; g.shadowBlur = S * 0.018; g.strokeStyle = 'rgba(255,214,120,0.95)'; g.lineWidth = Math.max(2, S * 0.006);
  g.beginPath(); g.moveTo(...s0); g.quadraticCurveTo(cx, cy, ...s1); g.stroke(); g.setLineDash([]);
  for (const [x, y, r] of [[...s0, 0.011], [...s1, 0.013]]) { const gr = g.createRadialGradient(x, y, 0, x, y, S * r * 2.6); gr.addColorStop(0, 'rgba(255,245,210,1)'); gr.addColorStop(0.35, 'rgba(255,200,90,0.7)'); gr.addColorStop(1, 'rgba(255,170,60,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, S * r * 2.6, 0, Math.PI * 2); g.fill(); }
  g.restore(); }
// a gentle vignette to pull the eye to the middle
{ const v = g.createRadialGradient(W / 2, H / 2, S * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.62); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(2,6,16,0.42)'); g.fillStyle = v; g.fillRect(0, 0, W, H); }
if (TEXT) {
  // a dark band along the bottom where the title sits
  const gr = g.createLinearGradient(0, H * (port ? 0.66 : 0.6), 0, H); gr.addColorStop(0, 'rgba(3,8,20,0)'); gr.addColorStop(0.55, 'rgba(3,8,20,0.6)'); gr.addColorStop(1, 'rgba(3,8,20,0.9)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const title = 'HELIOSCEND'; let fs = S * (land ? 0.16 : 0.15); const maxW = W * (land ? 0.62 : 0.86); g.font = `700 ${fs}px Oxanium`; while (g.measureText(title).width > maxW) { fs *= 0.96; g.font = `700 ${fs}px Oxanium`; }
  const x = W / 2, y = H - S * (land ? 0.085 : 0.075); g.textAlign = 'center'; g.textBaseline = 'alphabetic'; const tw = g.measureText(title).width, left = x - tw / 2; const ox = left + g.measureText('HELI').width + g.measureText('O').width / 2;
  // a thin sunrise arc rising behind the O
  g.save(); g.strokeStyle = 'rgba(255,200,90,0.9)'; g.lineWidth = Math.max(2, fs * 0.04); g.shadowColor = 'rgba(255,170,60,0.85)'; g.shadowBlur = S * 0.03; g.beginPath(); g.arc(ox, y - fs * 0.36, fs * 0.62, Math.PI * 1.08, Math.PI * 1.92); g.stroke(); g.restore();
  const tg = g.createLinearGradient(0, y - fs, 0, y); tg.addColorStop(0, '#ffffff'); tg.addColorStop(1, '#9fe9ff');
  g.save(); g.shadowColor = 'rgba(80,200,255,0.85)'; g.shadowBlur = S * 0.04; g.fillStyle = tg; g.fillText(title, x, y); g.restore();
  g.save(); g.lineWidth = Math.max(1.5, fs * 0.012); g.strokeStyle = 'rgba(6,14,30,0.55)'; g.strokeText(title, x, y); g.restore();
}
window.coverReady = true;
</script></body></html>
